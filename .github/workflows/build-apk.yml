name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Android APK with PWABuilder
      uses: pwa-builder/pwa-action@v1.0.1
      with:
        manifest-url: 'https://raw.githubusercontent.com/ahmedelzae2000-cmyk/my-video-bot/main/manifest.json'

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoAI-App-APK
        path: ./*.apk
