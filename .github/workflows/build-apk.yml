name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK via PWABuilder CLI Tool
      run: |
        npm install -g @pwabuilder/pwabuilder-android-cli
        pwabuilder-android generate \
          --manifest "https://raw.githubusercontent.com/ahmedelzae2000-cmyk/my-video-bot/main/manifest.json" \
          --name "AI Video Bot" \
          --packageId "com.myvideobot.twa" \
          --icon "https://via.placeholder.com/512.png" \
          --color "#000000" \
          --splashColor "#000000" \
          --shortName "VideoBot" \
          --startUrl "/ahmedelzae2000-cmyk/my-video-bot/main/index.html" \
          --output ./android-project

        cd android-project
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoAI-App-APK
        path: ./android-project/app/build/outputs/apk/debug/*.apk
