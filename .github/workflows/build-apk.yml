name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create Native TWA Project
      run: |
        npm install -g @bubblewrap/cli
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
        
        # إنشاء ملف الإعدادات المباشر
        mkdir -p app
        cat <<EOF > ./app/twa-manifest.json
        {
          "packageId": "com.myvideobot.twa",
          "host": "raw.githubusercontent.com",
          "name": "AI Video Bot",
          "launcherName": "VideoBot",
          "display": "standalone",
          "themeColor": "#000000",
          "navigationColor": "#000000",
          "appVersion": "1.0.0",
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "startUrl": "/ahmedelzae2000-cmyk/my-video-bot/main/index.html",
          "iconUrl": "https://via.placeholder.com/512.png",
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://raw.githubusercontent.com/ahmedelzae2000-cmyk/my-video-bot/main/manifest.json",
          "fallbackType": "customtabs",
          "features": {},
          "alphaDependencies": { "enabled": false },
          "enableNotifications": false,
          "minSdkVersion": 21
        }
        EOF

        # توليد البنية التحتية لتطبيق الأندرويد فقط
        cd app
        npx @bubblewrap/cli build --skipCluster --manifest=twa-manifest.json || true

    - name: Build APK via Gradle Direct
      run: |
        cd app
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoAI-App-APK
        path: |
          ./app/build/outputs/apk/debug/*.apk
          ./app/*.apk
