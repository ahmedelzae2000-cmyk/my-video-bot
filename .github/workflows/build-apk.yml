name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build APK Script
      run: |
        npm install -g @bubblewrap/cli
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
        
        mkdir -p app && cd app
        
        # إنشاء ملف الإعدادات
        cat <<EOF > twa-manifest.json
        {
          "packageId": "com.myvideobot.twa",
          "host": "raw.githubusercontent.com",
          "name": "AI Video Bot",
          "launcherName": "VideoBot",
          "display": "standalone",
          "themeColor": "#000000",
          "navigationColor": "#000000",
          "appVersion": "1.0.0",
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "startUrl": "/ahmedelzae2000-cmyk/my-video-bot/main/index.html",
          "iconUrl": "https://via.placeholder.com/512.png",
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://raw.githubusercontent.com/ahmedelzae2000-cmyk/my-video-bot/main/manifest.json",
          "fallbackType": "customtabs",
          "features": {},
          "alphaDependencies": { "enabled": false },
          "enableNotifications": false,
          "minSdkVersion": 21
        }
        EOF

        # وإنشاء ملف الكود التفصيلي للبناء التلقائي
        node -e '
        const { Keytool, TwaManifest, GradleWrapper } = require("@bubblewrap/core");
        const fs = require("fs");

        async function run() {
          const manifest = await TwaManifest.fromFile("./twa-manifest.json");
          const keytool = new Keytool();
          const keyOptions = {
            path: "./android.keystore",
            alias: "android",
            keypairAlias: "android",
            password: "password",
            keypassword: "password",
            fullName: "Developer",
            organization: "Dev",
            organizationalUnit: "Dev",
            country: "US"
          };
          await keytool.createSigningKey(keyOptions);
          
          const gradleWrapper = new GradleWrapper();
          const { buildTwa } = require("@bubblewrap/build");
          await buildTwa(manifest, "./", keyOptions);
        }
        run().catch(console.error);
        '

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoAI-App-APK
        path: ./app/*.apk
