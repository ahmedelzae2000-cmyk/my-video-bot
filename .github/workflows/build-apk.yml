name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install PWABuilder CLI
      run: npm install -g @pwabuilder/cli

    - name: Build APK non-interactively
      run: |
        pwabuilder https://raw.githubusercontent.com/ahmedelzae2000-cmyk/my-video-bot/main/manifest.json -p android -o ./output

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoAI-App-APK
        path: ./output/*.apk
