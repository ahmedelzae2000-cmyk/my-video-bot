name: Generate AI Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيديو'
        required: true
        default: 'قصة قصيرة مشوقة'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Libraries
      run: |
        pip install google-generativeai edge-tts moviepy requests

    - name: Run Video Generation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python app.py "${{ github.event.inputs.topic }}"

    - name: Upload Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: generated-video
        path: output_video.mp4
