<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Creator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; }
        header { background: #161b22; padding: 15px; text-align: center; border-bottom: 1px solid #30363d; font-size: 1.2rem; font-weight: bold; color: #58a6ff; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
        .user-msg { background: #238636; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-area { padding: 15px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; color: #fff; outline: none; font-size: 1rem; }
        input:focus { border-color: #58a6ff; }
        button { background: #238636; color: #fff; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>

    <header>صانع الفيديوهات الذكي</header>

    <div id="chat-container">
        <div class="message ai-msg">أهلاً بك! اكتب فكرة الفيديو وسأقوم بمساعدتك في توليد السيناريو والمحتوى خطوة بخطوة.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="اكتب فكرة الفيديو هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            
            if(!text) return;

            // إضافة رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-msg';
            userMsg.textContent = text;
            container.appendChild(userMsg);
            
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // محاكاة رد الذكاء الاصطناعي مؤقتاً لحين ربط الـ API
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-msg';
                aiMsg.textContent = "جاري تحليل الفكرة وإعداد السيناريو والمشاهد...";
                container.appendChild(aiMsg);
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
