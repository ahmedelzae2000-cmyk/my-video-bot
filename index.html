<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع الفيديوهات الذكي</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; color: #4fc3f7; margin-bottom: 8px; }
        p { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2b2b2b;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            width: 95%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0288d1;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background: #01579b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎬 صانع الفيديوهات الذكي</h1>
        <p>اكتب فكرة الفيديو وسيقوم الذكاء الاصطناعي بصناعته لك مجاناً</p>
        <input type="text" id="topic" placeholder="مثال: قصة مصعب بن عمير...">
        <button onclick="sendRequest()">صناعة الفيديو الآن 🚀</button>
        <p id="status" style="margin-top: 15px; color: #81c784;"></p>
    </div>

    <script>
        function sendRequest() {
            let topic = document.getElementById('topic').value;
            if(!topic) { alert('من فضلك اكتب موضوع الفيديو أولاً!'); return; }
            document.getElementById('status').innerText = 'جاري إرسال الطلب للسيرفر... ⏳';
            
            setTimeout(() => {
                window.location.href = "https://github.com/ahmedelzae2000-cmyk/my-video-bot/actions";
            }, 1500);
        }
    </script>
</body>
</html>
