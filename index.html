<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Creator Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; }
        header { background: #161b22; padding: 15px; text-align: center; border-bottom: 1px solid #30363d; font-size: 1.2rem; font-weight: bold; color: #58a6ff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        #api-key-input { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 0.85rem; outline: none; width: 220px; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 95%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; }
        .user-msg { background: #238636; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; align-self: flex-start; border-bottom-left-radius: 2px; width: 100%; }
        
        .scene-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .scene-title { color: #58a6ff; font-weight: bold; margin-bottom: 8px; font-size: 1rem; border-bottom: 1px solid #30363d; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .scene-desc { margin-bottom: 10px; color: #8b949e; }
        
        .btn-group { display: flex; gap: 8px; }
        .action-btn { background: #1f6feb; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        .action-btn:hover { background: #388bfd; }
        .img-btn { background: #8957e5; }
        .img-btn:hover { background: #a371f7; }

        .scene-image-container { margin-top: 10px; text-align: center; }
        .scene-image-container img { max-width: 100%; border-radius: 6px; border: 1px solid #30363d; margin-top: 5px; }

        #input-area { padding: 15px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; color: #fff; outline: none; font-size: 1rem; }
        input:focus { border-color: #58a6ff; }
        button { background: #238636; color: #fff; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>

    <header>
        <span>استوديو صانع الفيديوهات الذكي</span>
        <input type="password" id="api-key-input" placeholder="أدخل Gemini API Key" oninput="saveKey()">
    </header>

    <div id="chat-container">
        <div class="message ai-msg">أهلاً بك يا أحمد! أدخل المفتاح بالأعلى، واكتب فكرة الفيديو وسنقوم بتوليد السيناريو وتقسيمه لمشاهد مع أزرار التحكم الفوري وصور المشاهد.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="اكتب فكرة الفيديو هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إنشاء الفيديو</button>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            }
        };

        function saveKey() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const apiKeyInput = document.getElementById('api-key-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            const apiKey = apiKeyInput.value.trim();
            
            if(!text) return;
            if(!apiKey) {
                alert('الرجاء إدخال مفتاح Gemini API Key في الأعلى أولاً!');
                return;
            }

            localStorage.setItem('gemini_api_key', apiKey);

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-msg';
            userMsg.textContent = text;
            container.appendChild(userMsg);
            
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai-msg';
            aiMsg.textContent = "جاري تأليف السيناريو وتقسيمه وتجهيز الاستوديو المتكامل...";
            container.appendChild(aiMsg);
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `أنت مخرج ومصمم محتوى فيديو محترف. اكتب سيناريو فيديو بناءً على الفكرة: "${text}". قم بتقسيم السيناريو بوضوح إلى مشاهد (المشهد 1، المشهد 2، إلخ)، واكتب لكل مشهد وصف الصورة والتعليق الصوتي.`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                if(data.candidates && data.candidates[0].content) {
                    const rawText = data.candidates[0].content.parts[0].text;
                    aiMsg.innerHTML = "<strong>🎬 استوديو المشاهد والسيناريو الجاهز:</strong>";
                    
                    const scenes = rawText.split(/المشهد\s*(رقم)?\s*\d+/);
                    scenes.forEach((sceneText, index) => {
                        if(index === 0 && sceneText.trim() === "") return;
                        
                        const card = document.createElement('div');
                        card.className = 'scene-card';
                        card.innerHTML = `
                            <div class="scene-title">
                                <span>المشهد رقم ${index}</span>
                                <div class="btn-group">
                                    <button class="action-btn" onclick="copyScene(this)">نسخ النص</button>
                                    <button class="action-btn img-btn" onclick="generateSceneImage(this)">توليد صورة</button>
                                </div>
                            </div>
                            <div class="scene-desc">${sceneText}</div>
                            <div class="scene-image-container"></div>
                        `;
                        aiMsg.appendChild(card);
                    });

                    if(scenes.length <= 1) {
                        aiMsg.innerHTML = `<div style="white-space: pre-wrap;">${rawText}</div>`;
                    }

                } else if(data.error) {
                    aiMsg.textContent = "خطأ من جوجل: " + (data.error.message || "تأكد من صحة المفتاح.");
                } else {
                    aiMsg.textContent = "عذراً، حدث خطأ في استجابة الخادم.";
                }
            } catch (error) {
                aiMsg.textContent = "حدث خطأ في الاتصال بالشبكة.";
            }
            container.scrollTop = container.scrollHeight;
        }

        function copyScene(btn) {
            const cardText = btn.closest('.scene-card').querySelector('.scene-desc').textContent;
            navigator.clipboard.writeText(cardText).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "تم النسخ!";
                setTimeout(() => btn.textContent = originalText, 2000);
            });
        }

        function generateSceneImage(btn) {
            const card = btn.closest('.scene-card');
            const desc = card.querySelector('.scene-desc').textContent;
            const imgContainer = card.querySelector('.scene-image-container');
            
            // استخراج وصف بصري مختصر لتوليد صورة عبر خدمات مجانية سريعة (Pollinations AI)
            const promptEncoded = encodeURIComponent(desc.substring(0, 200));
            imgContainer.innerHTML = `<p style="color: #8b949e; font-size: 0.85rem;">⏳ جاري رسم وتوليد صورة المشهد بالذكاء الاصطناعي...</p>`;
            
            const imageUrl = `https://pollinations.ai/p/${promptEncoded}?width=512&height=320&seed=${Math.floor(Math.random() * 1000)}`;
            
            const img = new Image();
            img.src = imageUrl;
            img.onload = function() {
                imgContainer.innerHTML = `<img src="${imageUrl}" alt="صورة المشهد">`;
            };
            img.onerror = function() {
                imgContainer.innerHTML = `<p style="color: #f85149; font-size: 0.85rem;">تعذر توليد الصورة، حاول مرة أخرى.</p>`;
            };
        }
    </script>
</body>
</html>
